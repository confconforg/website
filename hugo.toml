baseURL = 'https://confconf.org/'
languageCode = 'en-us'
title = 'ConfConf 2026'

enableRobotsTXT = true
disablePathToLower = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark.renderer]
    # Required for raw HTML in content (e.g. pretix widget in tickets.md)
    unsafe = true

[params]
  description = "ConfConf is a free conference for organisers of conferences around free and open source software and hardware, and the surrounding ecosphere."

  [params.navbar]
    displayTitle = false
    displayLogo = true
    [params.navbar.logo]
      path = "logo-transparent.png"
      width = "83"
      height = "32"

  [params.footer]
    enable = false

[menu]
[[menu.main]]
    name       = "Home"
    url        = "/"
    weight     = 1

[[menu.main]]
    name       = "Program"
    url        = "/program/"
    weight     = 2

[[menu.main]]
    name       = "Tickets"
    url        = "/tickets/"
    weight     = 3

[[menu.main]]
    name       = "Practical"
    url        = "/practical/"
    weight     = 4

[[menu.main]]
    name       = "Accommodation"
    url        = "/accommodation/"
    weight     = 5

[[menu.main]]
    name       = "Contact"
    url        = "/contact/"
    weight     = 6

[[menu.main]]
    weight     = 7
    [menu.main.params]
      type = "theme-toggle"
