baseURL = 'https://confconf.org/'
languageCode = 'en-us'
title = 'ConfConf 2026'
theme = "hugo-universal-theme"

# Required if you want to render robots.txt template
enableRobotsTXT = true

# Needed for mermaid shortcodes
[markup]
  [markup.goldmark.renderer]
    # Needed for mermaid shortcode or when nesting shortcodes (e.g. img within
    # columns or tabs)
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

# Universal settings

# number of words of summarized post content (default 70)
summaryLength = 70

# not pluralize title pages by default
pluralizelisttitles = false
disablePathToLower = true

[menu]
[[menu.main]]
    name       = "Home"
    identifier = "menu.home"
    url        = "/"
    weight     = 1

[[menu.main]]
    name       = "Program"
    url        = "/program/"
    weight     = 2

[[menu.main]]
    name       = "Tickets"
    url        = "/tickets/"
    weight     = 3

[[menu.main]]
    name       = "Practical"
    url        = "/practical/"
    weight     = 4

[[menu.main]]
    name       = "Accommodation"
    url        = "/accommodation/"
    weight     = 5

[[menu.main]]
    name       = "Contact"
    url        = "/contact/"
    weight     = 6

# Define the number of posts per page
[pagination]
    pagerSize = 10

[params]
    viewMorePostLink = false
    author = "ConfConf Team"
    defaultKeywords = ["confconf"]
    mainSections = []
    defaultDescription = "ConfConf is a free conference for organisers of conferences around free and open source software and hardware."

    # Social media
    facebook_site = "" # the Facebook handle of your site ('https://www.facebook.com/HANDLE')
    twitter_site = "" # the Twitter handle of your site (without the '@')
    default_sharing_image = ""

    # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
    style = "turquoise"



    about_us = "<p>ConfConf is a conference for conference organisers.</p>"
    copyright = "Copyright (c) 2025, ConfConf; CC-BY-SA 4.0."

    # Format dates with Go's time formatting
    date_format = "January 2, 2006"

    dropdown_mouse_over = false

    disabled_logo = false
    logo_text = "ConfConf"

    logo = "logo-transparent.png"
    logo_small = "logo-transparent.png"
    contact_url = "/contact/"
    address = """<p class="text-uppercase"><strong>FOSDEM vzw c/o ConfConf</strong>
        <br>Guldendelle 9
        <br>1930 Zaventem
         <br>
        <strong>Belgium</strong>
      </p>
      """

# Enable and disable widgets for the right sidebar
[params.widgets]
    categories = true
    tags = true
    search = true

[params.see_more]
    enable = true
    icon = "far fa-file-alt"
    title = "ConfConf?"
    subtitle = "ConfConf is a free conference for organisers of conferences around free and open source software and hardware."
    link_url = "https://matrix.to/#/#confconf:matrix.org"
    link_text = "Join us on Matrix"

[params.recent_posts]
    enable = false
    about = "The idea is simple: a free, unconference-style gathering where we share experiences, challenges, and ideas about organizing FOSS events. We know a lot of us are struggling with the same challenges, and we hope that by getting together, we can all learn from one another."
    practical = "The first edition, ConfConf 2025, will take place in Sofia (Bulgaria) on the 5th and 6th of July 2025. See our tickets page for more information."
    program = "The event will be kickstarted with an opening keynote, and each day will be wrapped up with a summary session — but beyond that, the content will come from the participants."

    hide_summary = false

[params.footer.recent_posts]
    enable = true

[taxonomies]
    category = "categories"
    tag = "tags"
    author = "authors"
